<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Integration Test</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 20px; }
      .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
      .success { background-color: #d4edda; border-color: #c3e6cb; }
      .error { background-color: #f8d7da; border-color: #f5c6cb; }
      .info { background-color: #d1ecf1; border-color: #bee5eb; }
      button { padding: 10px 20px; margin: 5px; cursor: pointer; }
      pre { background-color: #f8f9fa; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
<h1>🧪 English Tutor AI - API Integration Test</h1>

<div class="test-section info">
    <h3>Integration Status</h3>
    <p><strong>API Proxy URL:</strong> https://api-proxy.ygna.blog</p>
    <p><strong>Services:</strong> Gemini AI, DeepL Translation</p>
    <p><strong>Security:</strong> API keys retrieved securely from proxy</p>
</div>

<div class="test-section">
    <h3>🤖 Gemini AI Test</h3>
    <button id="test-gemini">Test Gemini Analysis</button>
    <div id="gemini-result"></div>
</div>

<div class="test-section">
    <h3>🌐 DeepL Translation Test</h3>
    <button id="test-deepl">Test DeepL Translation</button>
    <div id="deepl-result"></div>
</div>

<div class="test-section">
    <h3>🔑 API Key Cache Test</h3>
    <button id="test-cache">Test API Key Caching</button>
    <div id="cache-result"></div>
</div>

<!-- Load API clients -->
<script src="js/api/ApiProxyClient.js"></script>
<script src="js/api/GeminiClient.js"></script>
<script src="js/TranslationService.js"></script>

<script>
    // Test Gemini AI
    document.getElementById('test-gemini').addEventListener('click', async () => {
        const resultDiv = document.getElementById('gemini-result');
        resultDiv.innerHTML = '<p>Testing Gemini AI...</p>';

        try {
            const result = await window.geminiClient.analyzeMessage("Hello, I want to test this system.");
            resultDiv.className = 'success';
            resultDiv.innerHTML = `
                    <h4>✅ Gemini Test Successful</h4>
                    <pre>${JSON.stringify(result, null, 2)}</pre>
                `;
        } catch (error) {
            resultDiv.className = 'error';
            resultDiv.innerHTML = `
                    <h4>❌ Gemini Test Failed</h4>
                    <p><strong>Error:</strong> ${error.message}</p>
                `;
        }
    });

    // Test DeepL Translation
    document.getElementById('test-deepl').addEventListener('click', async () => {
        const resultDiv = document.getElementById('deepl-result');
        resultDiv.innerHTML = '<p>Testing DeepL Translation...</p>';

        try {
            const translationService = new TranslationService();
            const result = await translationService.translateText("Hello world", "KO");
            resultDiv.className = 'success';
            resultDiv.innerHTML = `
                    <h4>✅ DeepL Test Successful</h4>
                    <pre>${JSON.stringify(result, null, 2)}</pre>
                `;
        } catch (error) {
            resultDiv.className = 'error';
            resultDiv.innerHTML = `
                    <h4>❌ DeepL Test Failed</h4>
                    <p><strong>Error:</strong> ${error.message}</p>
                `;
        }
    });

    // Test API Key Caching
    document.getElementById('test-cache').addEventListener('click', async () => {
        const resultDiv = document.getElementById('cache-result');
        resultDiv.innerHTML = '<p>Testing API Key Caching...</p>';

        try {
            // Test both services
            const start = Date.now();
            const geminiKey = await window.apiProxyClient.getApiKey('gemini');
            const deeplKey = await window.apiProxyClient.getApiKey('deepl');
            const firstCall = Date.now() - start;

            // Test cache hit
            const start2 = Date.now();
            await window.apiProxyClient.getApiKey('gemini');
            await window.apiProxyClient.getApiKey('deepl');
            const secondCall = Date.now() - start2;

            resultDiv.className = 'success';
            resultDiv.innerHTML = `
                    <h4>✅ Cache Test Successful</h4>
                    <p><strong>First call:</strong> ${firstCall}ms (API request)</p>
                    <p><strong>Second call:</strong> ${secondCall}ms (cache hit)</p>
                    <p><strong>Gemini cached:</strong> ${window.apiProxyClient.hasCachedKey('gemini')}</p>
                    <p><strong>DeepL cached:</strong> ${window.apiProxyClient.hasCachedKey('deepl')}</p>
                `;
        } catch (error) {
            resultDiv.className = 'error';
            resultDiv.innerHTML = `
                    <h4>❌ Cache Test Failed</h4>
                    <p><strong>Error:</strong> ${error.message}</p>
                `;
        }
    });
</script>
</body>
</html>
